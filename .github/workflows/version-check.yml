name: Version Check

# Every PR must bump the root VERSION file (plain "x.y.z"). Release tags it on
# merge. Used by repos with no package manifest (Go, C++, Shell).
on:
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  version-bumped:
    name: version bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the base branch to diff the version
          persist-credentials: false
      - name: Read versions
        id: v
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          pr=$(tr -d ' \r\n' < VERSION)
          # If VERSION doesn't exist on the base yet (the PR that introduces it),
          # treat the base as 0.0.0 so any real version passes the bump check.
          base=$(git show "origin/$BASE_REF:VERSION" 2>/dev/null | tr -d ' \r\n' || true)
          base=${base:-0.0.0}
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      # Not paths-ignore on the trigger: this job is a required check, so a
      # skipped run leaves the PR pending forever. It always runs and waives the
      # bump when only .github/ changed.
      - name: Does this PR change anything that ships
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'
          total=$(printf '%s\n' "$changed" | grep -c . || true)
          infra=$(printf '%s\n' "$changed" | grep -cE '^\.github/' || true)
          echo "total=${total:-0} infra-only=${infra:-0}"
          if [ "${total:-0}" -gt "${infra:-0}" ]; then
            echo "ships=true" >> "$GITHUB_OUTPUT"
          else
            echo "ships=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare
        env:
          PR: ${{ steps.v.outputs.pr }}
          BASE: ${{ steps.v.outputs.base }}
          SHIPS: ${{ steps.scope.outputs.ships }}
        run: |
          if [ "$SHIPS" != "true" ]; then
            echo "Only .github/ changed; version bump not required."
            exit 0
          fi
          echo "base=$BASE  pr=$PR"
          if [ "$PR" = "$BASE" ]; then
            echo "::error::VERSION not bumped (still $BASE)."
            exit 1
          fi
          greater=$(printf '%s\n%s\n' "$BASE" "$PR" | sort -V | tail -n1)
          if [ "$greater" != "$PR" ]; then
            echo "::error::VERSION $PR is lower than base $BASE."
            exit 1
          fi
          echo "Version bumped $BASE -> $PR ✓"
